<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم ديناميكية لأهداف المبيعات</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family:'Cairo',sans-serif; background:#f7fafc; }
    input[type="number"] { text-align:left; direction:ltr; }
    .status-badge { transition:all .3s ease-in-out; }
    .manager-section,#error-message,#loading-message { animation:fadeIn .5s ease-in-out; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    .sortable { cursor:pointer; user-select:none; }
    .sortable:hover { background:#e2e8f0; }
    .sort-asc::after { content:' ▲'; font-size:.8em; }
    .sort-desc::after { content:' ▼'; font-size:.8em; }
    .is-excluded { text-decoration:line-through; color:#9ca3af; background:#f3f4f6; }
    .exclude-toggle { transition:transform .2s; border:none; background:transparent; cursor:pointer; }
    .exclude-toggle:hover { transform:scale(1.2); }
    /* تضييق الجدول ليظهر كامل بدون تمرير أفقي */
    table { table-layout:fixed; }
    th, td { word-wrap:break-word; }
  </style>
</head>
<body class="p-4 md:p-8">
  <!-- الحاوية صارت بعرض كامل بدون max-w -->
  <div class="w-full mx-auto">
    <header class="mb-8 text-center">
      <h1 class="text-2xl md:text-4xl font-bold text-gray-800">لوحة تحكم أهداف المبيعات الشهرية</h1>
      <p class="text-gray-600 mt-2">قم بالتصفية حسب المدير، ثم حدد الهدف الإجمالي لكل معرض ووزّع الأهداف على الموظفين.</p>
      <div class="mt-6 max-w-md mx-auto flex flex-col items-center space-y-4">
        <div>
          <label for="manager-filter" class="block text-sm font-medium text-gray-700 mb-2">تصفية حسب المدير المشرف:</label>
          <select id="manager-filter" class="block w-full p-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" disabled>
            <option value="all">عرض الكل</option>
          </select>
        </div>
        <button id="export-button" class="px-8 py-3 bg-green-600 text-white font-semibold rounded-md shadow-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 disabled:bg-gray-400 disabled:cursor-not-allowed" disabled>
          تصدير إلى Excel
        </button>
      </div>
    </header>

    <div id="loading-message" class="text-center p-8">
      <p class="text-lg text-gray-600">جاري تحميل البيانات من ملف data.json...</p>
    </div>
    <div id="error-message" class="hidden text-center p-8 bg-red-100 border border-red-400 text-red-700 rounded-lg"></div>

    <div id="dashboard-container" class="space-y-12"></div>
  </div>

  <script>
    const container = document.getElementById('dashboard-container');
    const managerFilter = document.getElementById('manager-filter');
    const loadingMessage = document.getElementById('loading-message');
    const errorMessage = document.getElementById('error-message');
    const exportButton = document.getElementById('export-button');

    function normalizeName(name){
      if(!name || typeof name!=='string') return '';
      return name.toLowerCase().trim().replace(/[-_]/g,' ').replace(/\s+/g,' ');
    }

    async function initializeDashboard(){
      try{
        const response = await fetch('data.json');
        if(!response.ok){
          throw new Error("فشل تحميل ملف 'data.json'.<br>يرجى التأكد من تشغيل سكربت البايثون 'converter.py' أولاً لوإنشاء هذا الملف.");
        }
        const data = await response.json();
        const { managers, employees_by_store } = data;

        loadingMessage.style.display='none';
        managerFilter.disabled=false;
        exportButton.disabled=false;
        renderDashboard(employees_by_store, managers);

      }catch(error){
        loadingMessage.style.display='none';
        errorMessage.innerHTML = error.message;
        errorMessage.classList.remove('hidden');
        console.error(error);
      }
    }

    function formatCurrency(number){
      return new Intl.NumberFormat('en-SA',{style:'currency',currency:'SAR',minimumFractionDigits:0}).format(number);
    }

    function updateStoreTotals(storeId){
      const storeCard = document.getElementById(`store-card-${storeId}`);
      if(!storeCard) return;
      const storeTargetInput = storeCard.querySelector('.store-target-input');
      const totalEmployeesTargetEl = storeCard.querySelector('.total-employees-target');
      const statusBadge = storeCard.querySelector('.status-badge');
      const statusText = storeCard.querySelector('.status-text');

      const storeTarget = parseFloat(storeTargetInput.value)||0;
      let totalEmployeesTarget = 0;
      storeCard.querySelectorAll('.employee-target-input').forEach(input=>{
        totalEmployeesTarget += parseFloat(input.value)||0;
      });
      totalEmployeesTargetEl.textContent = formatCurrency(totalEmployeesTarget);

      if(storeTarget===0){
        statusBadge.className='status-badge p-2 h-10 flex items-center justify-center rounded-md font-bold bg-gray-100 text-gray-800';
        statusText.textContent="أدخل هدف المعرض";
      }else if(totalEmployeesTarget >= storeTarget){
        statusBadge.className='status-badge p-2 h-10 flex items-center justify-center rounded-md font-bold bg-green-100 text-green-800';
        statusText.textContent="تم تحقيق الهدف";
      }else{
        statusBadge.className='status-badge p-2 h-10 flex items-center justify-center rounded-md font-bold bg-red-100 text-red-800';
        statusText.textContent=`متبقي: ${formatCurrency(storeTarget - totalEmployeesTarget)}`;
      }
    }

    function createStoreCard(storeId, storeData){
      const employees = storeData.employees || [];
      let employeesHtml = '';

      // شلت whitespace-nowrap من الرؤوس وخففت الحشوة والخط
      let headerHtml = `<th class="p-2 text-center w-10 text-xs md:text-sm">استثناء</th><th class="p-2 text-xs md:text-sm sortable" data-sort-key="name" data-store-id="${storeId}">اسم الموظف</th>`;
      for(let i=1;i<=9;i++){
        headerHtml += `<th class="p-2 text-xs md:text-sm sortable" data-sort-key="sales-${i-1}" data-store-id="${storeId}">مبيعات شهر ${i}</th>`;
      }
      headerHtml += `<th class="p-2 text-xs md:text-sm sortable text-blue-600" data-sort-key="target" data-store-id="${storeId}">التارجت الجديد</th>`;

      if(employees.length>0){
        employees.forEach(employee=>{
          let salesCells='';
          employee.sales.forEach(sale=>{
            salesCells += `<td class="p-2 text-gray-600 text-xs md:text-sm">${formatCurrency(sale)}</td>`;
          });
          const last3 = employee.sales.slice(-3);
          const avgSales = last3.reduce((a,b)=>a+b,0)/(last3.length||1);

          employeesHtml += `
            <tr class="border-b hover:bg-gray-50"
                data-excluded="false"
                data-employee-name="${employee.name}"
                data-system-name="${employee.system_name}"
                data-avg-sales="${avgSales}">
              <td class="p-2 text-center"><button class="exclude-toggle text-lg" title="استثناء من التوزيع التلقائي">✔️</button></td>
              <td class="p-2 font-semibold text-gray-700 text-xs md:text-sm">${employee.name}</td>
              ${salesCells}
              <td class="p-2"><input type="number" min="0" placeholder="0" class="employee-target-input w-24 md:w-28 p-2 border rounded-md focus:ring-2 focus:ring-blue-500" data-store-id="${storeId}"></td>
            </tr>`;
        });
      }else{
        employeesHtml = `<tr><td colspan="12" class="p-4 text-center text-gray-500 text-sm">لا يوجد موظفين لهذا المعرض.</td></tr>`;
      }

      return `
        <div class="bg-white rounded-xl shadow-md p-6 border border-gray-200" id="store-card-${storeId}">
          <h3 class="text-lg md:text-xl font-bold text-gray-800 mb-4">${storeData.original_name}</h3>

          <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 bg-gray-50 p-4 rounded-lg items-end">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">الهدف الإجمالي للمعرض</label>
              <input type="number" min="0" placeholder="100000" class="store-target-input w-full p-2 border rounded-md" data-store-id="${storeId}">
            </div>
            <div>
              <button class="auto-distribute-btn w-full px-4 py-2 bg-blue-600 text-white font-semibold rounded-md shadow-md hover:bg-blue-700" data-store-id="${storeId}">توزيع تلقائي</button>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">مجموع أهداف الموظفين</label>
              <div class="total-employees-target p-2 h-10 flex items-center font-bold text-lg text-blue-700">${formatCurrency(0)}</div>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">الحالة</label>
              <div class="status-badge p-2 h-10 flex items-center justify-center rounded-md bg-gray-100 text-gray-800 font-bold">
                <span class="status-text">أدخل هدف المعرض</span>
              </div>
            </div>
          </div>

          <!-- شلت overflow-x-auto -->
          <div>
            <table class="w-full table-fixed text-right text-xs md:text-sm employee-table">
              <thead class="bg-gray-100 text-gray-600 uppercase">
                <tr>${headerHtml}</tr>
              </thead>
              <tbody class="divide-y">${employeesHtml}</tbody>
            </table>
          </div>
        </div>`;
    }

    function renderDashboard(employeesByStore, managers){
      let storeIdCounter=1;
      const assignedStores=new Set();

      for(const managerName in managers){
        const option=document.createElement('option');
        option.value=managerName; option.textContent=managerName;
        managerFilter.appendChild(option);

        const managerSection=document.createElement('div');
        managerSection.className='manager-section';
        managerSection.dataset.managerName=managerName;

        let storeCardsHtml='';
        managers[managerName].forEach(originalStoreName=>{
          const normalizedName=normalizeName(originalStoreName);
          const storeData=employeesByStore[normalizedName];
          if(storeData){
            storeCardsHtml += createStoreCard(storeIdCounter++, storeData);
            assignedStores.add(normalizedName);
          }
        });

        managerSection.innerHTML = `
          <h2 class="text-xl md:text-3xl font-bold text-indigo-600 border-b-2 border-indigo-200 pb-2 mb-6">${managerName}</h2>
          <div class="grid grid-cols-1 gap-6">${storeCardsHtml}</div>`;
        container.appendChild(managerSection);
      }

      const allEmployeeStores=new Set(Object.keys(employeesByStore));
      const unassignedStores=[...allEmployeeStores].filter(n=>!assignedStores.has(n));
      if(unassignedStores.length>0){
        const unassignedManagerName="معارض غير مسندة لمدير";
        const option=document.createElement('option');
        option.value=unassignedManagerName; option.textContent=unassignedManagerName;
        managerFilter.appendChild(option);

        const managerSection=document.createElement('div');
        managerSection.className='manager-section';
        managerSection.dataset.managerName=unassignedManagerName;

        let storeCardsHtml='';
        unassignedStores.forEach(n=>{
          const storeData=employeesByStore[n];
          storeCardsHtml += createStoreCard(storeIdCounter++, storeData);
        });

        managerSection.innerHTML = `
          <h2 class="text-xl md:text-3xl font-bold text-amber-600 border-b-2 border-amber-200 pb-2 mb-6">${unassignedManagerName}</h2>
          <div class="grid grid-cols-1 gap-6">${storeCardsHtml}</div>`;
        container.appendChild(managerSection);
      }
    }

    function autoDistributeTarget(storeId){
      const storeCard=document.getElementById(`store-card-${storeId}`);
      const storeTarget=parseFloat(storeCard.querySelector('.store-target-input').value)||0;
      if(storeTarget===0) return;

      const includedRows=storeCard.querySelectorAll('tbody tr[data-excluded="false"]');
      const excludedRows=storeCard.querySelectorAll('tbody tr[data-excluded="true"]');
      const n = includedRows.length;

      let rounded=0;
      if(n>0){
        const per = storeTarget/n;
        rounded = Math.round(per/1000)*1000;
      }

      includedRows.forEach(r=>{ r.querySelector('.employee-target-input').value=rounded; });
      excludedRows.forEach(r=>{ r.querySelector('.employee-target-input').value=0; });

      updateStoreTotals(storeId);
    }

    function sortEmployeeTable(storeId,key,order){
      const table=document.getElementById(`store-card-${storeId}`).querySelector('.employee-table');
      const tbody=table.querySelector('tbody');
      const rows=Array.from(tbody.querySelectorAll('tr'));

      rows.sort((a,b)=>{
        let valA,valB;
        const nameColIndex=1;
        const salesStartIndex=2;

        if(key==='name'){
          valA=a.children[nameColIndex].textContent.trim();
          valB=b.children[nameColIndex].textContent.trim();
        }else if(key.startsWith('sales-')){
          const colIndex=parseInt(key.split('-')[1])+salesStartIndex;
          valA=parseFloat(a.children[colIndex].textContent.replace(/[^\d.-]/g,''))||0;
          valB=parseFloat(b.children[colIndex].textContent.replace(/[^\d.-]/g,''))||0;
        }else if(key==='target'){
          valA=parseFloat(a.querySelector('.employee-target-input').value)||0;
          valB=parseFloat(b.querySelector('.employee-target-input').value)||0;
        }
        if(typeof valA==='string') return valA.localeCompare(valB)*(order==='asc'?1:-1);
        return (valA-valB)*(order==='asc'?1:-1);
      });
      rows.forEach(r=>tbody.appendChild(r));
    }

    function exportToExcel(){
      const dataToExport=[];
      document.querySelectorAll('.manager-section').forEach(section=>{
        const managerName=section.querySelector('h2').textContent.trim();
        section.querySelectorAll('.bg-white').forEach(card=>{
          const storeName=card.querySelector('h3').textContent.trim();
          card.querySelectorAll('tbody tr').forEach(row=>{
            if(row.dataset.employeeName){
              const targetInput=row.querySelector('.employee-target-input');
              const targetValue=targetInput?parseFloat(targetInput.value)||0:0;
              const avgSales=parseFloat(row.dataset.avgSales)||0;
              dataToExport.push({
                'المدير المسؤول':managerName,
                'اسم المعرض':storeName,
                'اسم الموظف':row.dataset.employeeName,
                'اسمه عالسستم':row.dataset.systemName,
                'متوسط آخر 3 شهور':avgSales,
                'التارجت المدخل':targetValue
              });
            }
          });
        });
      });
      if(dataToExport.length===0){
        const original=exportButton.textContent;
        exportButton.textContent='لا يوجد بيانات للتصدير!';
        exportButton.classList.add('bg-yellow-500','hover:bg-yellow-600');
        setTimeout(()=>{
          exportButton.textContent=original;
          exportButton.classList.remove('bg-yellow-500','hover:bg-yellow-600');
        },3000);
        return;
      }
      const ws=XLSX.utils.json_to_sheet(dataToExport);
      const wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Targets");
      XLSX.writeFile(wb, "Targets_Export.xlsx");
    }

    document.addEventListener('DOMContentLoaded',()=>{
      initializeDashboard();

      container.addEventListener('input', e=>{
        if(e.target.matches('.store-target-input, .employee-target-input')) updateStoreTotals(e.target.dataset.storeId);
      });

      managerFilter.addEventListener('change', e=>{
        const selected=e.target.value;
        document.querySelectorAll('.manager-section').forEach(s=>{
          s.style.display = (selected==='all' || s.dataset.managerName===selected) ? 'block' : 'none';
        });
      });

      exportButton.addEventListener('click', exportToExcel);

      container.addEventListener('click', e=>{
        if(e.target.matches('.auto-distribute-btn')){
          autoDistributeTarget(e.target.dataset.storeId);
        }
        if(e.target.matches('.sortable')){
          const storeId=e.target.dataset.storeId; if(!storeId) return;
          const key=e.target.dataset.sortKey;
          const isAsc=e.target.classList.contains('sort-asc');
          document.querySelectorAll(`#store-card-${storeId} .sortable`).forEach(th=>th.classList.remove('sort-asc','sort-desc'));
          if(isAsc){
            e.target.classList.add('sort-desc'); sortEmployeeTable(storeId,key,'desc');
          }else{
            e.target.classList.add('sort-asc');  sortEmployeeTable(storeId,key,'asc');
          }
        }
        if(e.target.matches('.exclude-toggle')){
          const row=e.target.closest('tr');
          const storeId=e.target.closest('.bg-white').id.replace('store-card-','');
          const isExcluded=row.dataset.excluded==='true';

          row.dataset.excluded=!isExcluded;
          e.target.textContent = !isExcluded ? '🚫' : '✔️';
          e.target.title = !isExcluded ? 'إعادة الموظف للتوزيع' : 'استثناء من التوزيع التلقائي';
          row.classList.toggle('is-excluded', !isExcluded);

          if(!isExcluded){
            row.querySelector('.employee-target-input').value=0;
            updateStoreTotals(storeId);
          }
        }
      });
    });
  </script>
</body>
</html>
